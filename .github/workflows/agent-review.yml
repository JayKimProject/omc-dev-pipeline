name: Agent Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: number

concurrency:
  group: reviewer-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    # For pull_request events: only review agent/ branches
    # For workflow_dispatch: always run
    if: startsWith(github.head_ref, 'agent/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: write        # merge PR
      pull-requests: write   # post review comment
      issues: read

    steps:
      - name: Resolve PR number
        id: pr
        run: |
          echo "number=${{ github.event.pull_request.number || inputs.pr_number }}" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          # Check out the PR branch so read_file works on the changed files
          ref: ${{ github.head_ref || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Reviewer Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_BIN: gh
        run: |
          python agents/reviewer.py --pr ${{ steps.pr.outputs.number }}
