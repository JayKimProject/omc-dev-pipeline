name: Agent Developer

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "GitHub issue number to process"
        required: true
        type: number

concurrency:
  group: developer-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  develop:
    if: github.event.label.name == 'agent-task' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: write        # push branches
      pull-requests: write   # create PRs
      issues: write          # comment on issues

    steps:
      - name: Resolve issue number
        id: issue
        run: |
          echo "number=${{ github.event.issue.number || inputs.issue_number }}" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # GH_PAT required: GITHUB_TOKEN pushes do NOT trigger pull_request workflows
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity and credentials
        run: |
          git config user.name  "Developer Agent"
          git config user.email "agent-developer@users.noreply.github.com"
          # Explicitly use PAT so git push triggers the pull_request workflow
          git remote set-url origin \
            https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git

      - name: Run Developer Agent
        id: developer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_BIN: gh
        run: |
          set -o pipefail
          python agents/developer.py --issue ${{ steps.issue.outputs.number }} 2>&1 | tee /tmp/dev_output.txt
          # Extract PR URL from output
          pr_url=$(grep -oP 'https://github\.com/\S+/pull/\d+' /tmp/dev_output.txt | tail -1 || true)
          echo "pr_url=$pr_url" >> $GITHUB_OUTPUT

      - name: Comment on issue with result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          pr_url="${{ steps.developer.outputs.pr_url }}"
          if [ -n "$pr_url" ]; then
            body="🤖 **Developer Agent finished.**

          Pull Request: $pr_url

          The Reviewer Agent will evaluate and merge it automatically."
          else
            body="🤖 **Developer Agent finished** (no PR URL captured).

          Check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
          fi
          gh issue comment ${{ steps.issue.outputs.number }} --body "$body"
