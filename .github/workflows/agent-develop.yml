name: Agent Developer

on:
  issues:
    types: [labeled]

jobs:
  develop:
    # Only run when the 'agent-task' label is added
    if: github.event.label.name == 'agent-task'
    runs-on: ubuntu-latest

    permissions:
      contents: write        # push branches
      pull-requests: write   # create PRs
      issues: write          # comment on issues

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use PAT so pushes trigger downstream workflows
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name  "Developer Agent"
          git config user.email "agent-developer@users.noreply.github.com"

      - name: Run Developer Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_BIN: gh
        run: |
          python agents/developer.py --issue ${{ github.event.issue.number }}

      - name: Comment on issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --body "🤖 Developer agent finished. Check for a new PR from branch \`agent/issue-${{ github.event.issue.number }}-*\`."
